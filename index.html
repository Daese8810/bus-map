<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
  />
  <title>Bus Live Map</title>

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #f5f7fb;
    }

    .bus-marker-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

.bus-marker {
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  box-shadow: none;
  font-size: 42px;
  line-height: 1;
  transform-origin: center center;
  transition: transform 0.2s linear;
}


.bus-label {
  margin-top: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid #CBEFD9;
  color: #03C75A;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
}
  </style>

  <script>
    window.navermap_authFailure = function () {
      if (window.NaverMapBridge) {
        window.NaverMapBridge.postMessage('auth_failed');
      }
    };
  </script>

  <!-- 여기에 발급받은 Client ID 넣기 -->
<script
  type="text/javascript"
  src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=3cdxe9wgyj&callback=initMap"
></script>
</head>
<body>
  <div id="map"></div>

  <script>
let map = null;
let marker = null;
let currentLatLng = null;
let animationFrameId = null;
let followVehicle = true;
let prevAngle = null;

    function initMap() {
      const defaultCenter = new naver.maps.LatLng(37.5666102, 126.9783881);

      map = new naver.maps.Map('map', {
        center: defaultCenter,
        zoom: 15,
        minZoom: 10,
        maxZoom: 19,
        mapDataControl: false,
        scaleControl: false,
        logoControl: true,
        zoomControl: true,
        zoomControlOptions: {
          position: naver.maps.Position.TOP_RIGHT
        }
      });

      marker = new naver.maps.Marker({
        position: defaultCenter,
        map: map,
        title: '셔틀버스',
        icon: {
content:
  '<div class="bus-marker-wrap">' +
    '<div id="busMarkerIcon" class="bus-marker">🚌</div>' +
    '<div id="busLabel" class="bus-label">셔틀버스</div>' +
  '</div>',
          size: new naver.maps.Size(72, 90),
          anchor: new naver.maps.Point(36, 72)
        }
      });


      if (window.NaverMapBridge) {
        window.NaverMapBridge.postMessage('map_ready');
      }
    }

    function updateBusLabel(label) {
      const labelEl = document.getElementById('busLabel');
      if (labelEl) {
        labelEl.innerText = label || '셔틀버스';
      }
    }

    function setFollowMode(enabled) {
      followVehicle = !!enabled;
      if (followVehicle) {
        centerVehicle();
      }
    }

function calculateBearing(prevLat, prevLng, newLat, newLng) {
  const toRad = (deg) => deg * Math.PI / 180;
  const toDeg = (rad) => rad * 180 / Math.PI;

  const lat1 = toRad(prevLat);
  const lat2 = toRad(newLat);
  const dLng = toRad(newLng - prevLng);

  const y = Math.sin(dLng) * Math.cos(lat2);
  const x =
    Math.cos(lat1) * Math.sin(lat2) -
    Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);

  const brng = toDeg(Math.atan2(y, x));
  return (brng + 360) % 360;
}

function getCameraTargetForVehicle(coord) {
  if (!map) return coord;

  const projection = map.getProjection();
  const offset = projection.fromCoordToOffset(coord);

  // 값이 커질수록 버스가 화면에서 더 위로 올라와 보입니다.
  const shifted = new naver.maps.Point(offset.x, offset.y + 170);

  return projection.fromOffsetToCoord(shifted);
}

function centerVehicle() {
  if (!map || !currentLatLng) return;
  map.panTo(getCameraTargetForVehicle(currentLatLng), {
    duration: 700,
    easing: 'easeOutCubic'
  });
}

function updateVehicle(lat, lng, label, follow) {
  if (!map || !marker) return;

  if (typeof follow === 'boolean') {
    followVehicle = follow;
  }

  const target = new naver.maps.LatLng(lat, lng);
  updateBusLabel(label);

  // 첫 위치 진입
  if (!currentLatLng) {
    currentLatLng = target;
    marker.setPosition(target);

    if (followVehicle) {
      map.setCenter(target);
    }
    return;
  }

  if (animationFrameId) {
    cancelAnimationFrame(animationFrameId);
    animationFrameId = null;
  }

  // ✅ 핵심: 현재 목표점이 아니라, 지금 화면에 보이는 마커 위치에서 출발
  const currentMarkerPos = marker.getPosition() || currentLatLng;

  const startLat = currentMarkerPos.lat();
  const startLng = currentMarkerPos.lng();
  const endLat = target.lat();
  const endLng = target.lng();

  // 같은 좌표면 굳이 애니메이션 안 함
  if (
    Math.abs(startLat - endLat) < 0.000001 &&
    Math.abs(startLng - endLng) < 0.000001
  ) {
    currentLatLng = target;
    return;
  }

  const startTime = performance.now();

  // ✅ polling 1.2초면 애니메이션은 살짝 더 길게
  const duration = 1400;

  if (followVehicle) {
    map.panTo(target, {
      duration: duration,
      easing: 'easeOutCubic'
    });
  }

function animate(now) {
  const progress = Math.min((now - startTime) / duration, 1);
  const eased = 1 - Math.pow(1 - progress, 3);

  const nextLat = startLat + ((endLat - startLat) * eased);
  const nextLng = startLng + ((endLng - startLng) * eased);
  const nextPos = new naver.maps.LatLng(nextLat, nextLng);

  const movedEnough =
    Math.abs(endLat - startLat) > 0.00001 ||
    Math.abs(endLng - startLng) > 0.00001;

  if (movedEnough) {
    let angle = calculateBearing(startLat, startLng, endLat, endLng);

    // 각도 급변 방지
    if (prevAngle !== null) {
      let diff = Math.abs(angle - prevAngle);
      diff = Math.min(diff, 360 - diff);

      if (diff > 120) {
        angle = prevAngle;
      }
    }

    prevAngle = angle;

    const busElement = document.getElementById('busMarkerIcon');
    if (busElement) {
      busElement.style.transform = `rotate(${angle}deg)`;
    }
  }

  marker.setPosition(nextPos);

  if (progress < 1) {
    animationFrameId = requestAnimationFrame(animate);
    return;
  }

  if (movedEnough) {
    const finalAngle = calculateBearing(startLat, startLng, endLat, endLng);
    prevAngle = finalAngle;

    const finalBusElement = document.getElementById('busMarkerIcon');
    if (finalBusElement) {
      finalBusElement.style.transform = `rotate(${finalAngle}deg)`;
    }
  }

  currentLatLng = target;
  marker.setPosition(target);
  animationFrameId = null;
}

animationFrameId = requestAnimationFrame(animate);
}
</script>
</body>
</html>
