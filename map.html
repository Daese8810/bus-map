<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>차량 위치 조회</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
      background: #eef4fb;
      color: #0f172a;
    }

    .page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    .hero {
      padding: 16px 18px 10px;
      background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 100%);
      color: white;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      font-size: 13px;
      font-weight: 700;
    }

    .hero-title {
      margin-top: 8px;
      font-size: 24px;
      font-weight: 800;
    }

    .hero-sub {
      margin-top: 6px;
      font-size: 13px;
      opacity: 0.88;
      line-height: 1.5;
    }

    .map-section {
      position: relative;
      flex: 1 1 auto;
      height: 58vh;
      min-height: 420px;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #dfe7f2;
    }

    .loading-layer {
      position: absolute;
      inset: 0;
      z-index: 550;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(3px);
    }

    .loading-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      background: rgba(255,255,255,0.95);
      border-radius: 18px;
      box-shadow: 0 16px 36px rgba(15,23,42,0.14);
      font-size: 14px;
      font-weight: 700;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 3px solid #dbeafe;
      border-top-color: #1d4ed8;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .bottom-card {
      position: relative;
      z-index: 600;
      margin: -28px 16px 16px;
      padding: 18px;
      background: rgba(255,255,255,0.98);
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(15,23,42,0.16);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-top: 10px;
    }

    .info-label {
      min-width: 70px;
      font-size: 13px;
      font-weight: 800;
      color: #64748b;
    }

    .info-value {
      flex: 1;
      text-align: right;
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.5;
    }

    .error-box {
      display: none;
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #c2410c;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
      word-break: break-all;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      height: 46px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-primary {
      border: none;
      background: #339FFE;
      color: white;
    }

    .btn-secondary {
      border: 1.6px solid #339FFE;
      background: white;
      color: #339FFE;
    }
  </style>

  <script>
    // 네이버 지도 로딩 상태를 관리하기 위한 변수
    window.__naverSdkReady = false;
    
    function onNaverMapsLoaded() {
      window.__naverSdkReady = true;
      // 로딩이 완료된 시점에 만약 startApp 함수가 준비되어 있다면 즉시 실행
      if (typeof startApp === 'function') {
        startApp();
      }
    }

    window.navermap_authFailure = function () {
      showError('네이버 지도 인증 실패입니다. GitHub Pages 도메인 등록 상태를 확인해주세요.');
      setLoading(false);
    };
  </script>

  <script
    type="text/javascript"
    src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=3cdxe9wgyj&callback=onNaverMapsLoaded">
  </script>
</head>
<body>
  <div class="page">
    <div class="hero">
      <div class="chip">🛰️ 20초마다 자동 갱신 · 사이 구간은 부드럽게 이동</div>
      <div class="hero-title" id="pageTitle">차량 위치 조회</div>
      <div class="hero-sub">네이버 지도 위에서 차량 마커가 다음 좌표까지 자연스럽게 움직입니다.</div>
    </div>

    <div class="map-section">
      <div id="map"></div>

      <div class="loading-layer" id="loadingLayer">
        <div class="loading-card">
          <div class="spinner"></div>
          <div id="loadingText">차량 위치를 불러오는 중입니다...</div>
        </div>
      </div>
    </div>

    <div class="bottom-card">
      <div class="info-row">
        <div class="info-label">차량</div>
        <div class="info-value" id="busLabelText">-</div>
      </div>

      <div class="info-row">
        <div class="info-label">갱신 시각</div>
        <div class="info-value" id="updatedAtText">-</div>
      </div>

      <div class="info-row">
        <div class="info-label">지도</div>
        <div class="info-value" id="followStateText">자동 따라가기 켜짐</div>
      </div>

      <div class="error-box" id="errorBox"></div>

      <div class="actions">
        <button class="btn btn-primary" onclick="refreshLocation()">새로고침</button>
        <button class="btn btn-secondary" id="followToggleBtn" onclick="toggleAutoFollow()">따라가기 끄기</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_API_BASE = 'https://script.google.com/macros/s/AKfycbwi8CAMgBZ99QoPTCbU6nGxK7QM8cx0JKlsMpBQuouHwEoa51qUw_qfvM4rCnYrJR7k/exec';
    const REFRESH_INTERVAL_MS = 20000;
    const MOVE_DURATION_MS = 18000;

    const params = new URLSearchParams(window.location.search);
    const BUS_NUM = (params.get('busNum') || '').trim();

    let map;
    let busMarker;
    let refreshTimer = null;
    let animationFrameId = null;
    let currentLat = null;
    let currentLng = null;
    let autoFollow = true;
    let isAppStarted = false;

    function setLoading(show, text) {
      document.getElementById('loadingLayer').style.display = show ? 'flex' : 'none';
      if (text) {
        document.getElementById('loadingText').textContent = text;
      }
    }

    function showError(message) {
      const box = document.getElementById('errorBox');
      box.style.display = 'block';
      box.textContent = message || '오류가 발생했습니다.';
    }

    function hideError() {
      const box = document.getElementById('errorBox');
      box.style.display = 'none';
      box.textContent = '';
    }

    // 시간 표기 오류 방지를 위한 안전한 포맷 함수
    function formatUpdatedAt(value) {
      try {
        if (!value) return '방금 조회됨';
        const d = new Date(value);
        if (isNaN(d.getTime())) return String(value);
        return d.toLocaleString('ko-KR'); // 브라우저 자체 한글 날짜 포맷 사용
      } catch (e) {
        return String(value);
      }
    }

    function initMap() {
      map = new naver.maps.Map('map', {
        center: new naver.maps.LatLng(37.5665, 126.9780),
        zoom: 15,
        zoomControl: true,
        zoomControlOptions: {
          position: naver.maps.Position.RIGHT_CENTER
        }
      });
    }

    function ensureMarker(label, lat, lng) {
      const position = new naver.maps.LatLng(lat, lng);

      if (!busMarker) {
        busMarker = new naver.maps.Marker({
          position,
          map,
          title: label
        });
        currentLat = lat;
        currentLng = lng;
        return;
      }

      busMarker.setPosition(position);
      busMarker.setTitle(label);
    }

    function moveMarkerInstant(lat, lng) {
      currentLat = lat;
      currentLng = lng;
      busMarker.setPosition(new naver.maps.LatLng(lat, lng));
    }

    function animateMarkerTo(targetLat, targetLng, durationMs) {
      if (!busMarker) return;

      if (currentLat == null || currentLng == null) {
        moveMarkerInstant(targetLat, targetLng);
        return;
      }

      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
      }

      const startLat = currentLat;
      const startLng = currentLng;
      const startTime = performance.now();

      function easeInOutQuad(t) {
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      }

      function frame(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / durationMs, 1);
        const eased = easeInOutQuad(progress);

        const nextLat = startLat + (targetLat - startLat) * eased;
        const nextLng = startLng + (targetLng - startLng) * eased;

        currentLat = nextLat;
        currentLng = nextLng;
        busMarker.setPosition(new naver.maps.LatLng(nextLat, nextLng));

        if (progress < 1) {
          animationFrameId = requestAnimationFrame(frame);
        } else {
          animationFrameId = null;
          currentLat = targetLat;
          currentLng = targetLng;
          busMarker.setPosition(new naver.maps.LatLng(targetLat, targetLng));
        }
      }

      animationFrameId = requestAnimationFrame(frame);
    }

    function renderLocation(result) {
      try {
        const lat = Number(result.latitude);
        const lng = Number(result.longitude);
        const label = result.displayLabel || result.busNum || BUS_NUM || '차량';

        if (isNaN(lat) || isNaN(lng)) {
          showError('차량 좌표 정보가 없습니다.');
          return;
        }

        document.title = `${label} 현재 위치`;
        document.getElementById('pageTitle').textContent = `${label} 현재 위치`;
        document.getElementById('busLabelText').textContent = label;
        document.getElementById('updatedAtText').textContent = formatUpdatedAt(result.updatedAt);

        const isFirstRender = currentLat == null || currentLng == null;
        const changed = !isFirstRender &&
          (Math.abs(currentLat - lat) > 0.000001 || Math.abs(currentLng - lng) > 0.000001);

        // 여기서부터 네이버 지도 객체를 다룹니다
        ensureMarker(label, lat, lng);

        const targetPosition = new naver.maps.LatLng(lat, lng);

        if (isFirstRender) {
          moveMarkerInstant(lat, lng);
          map.setCenter(targetPosition);
          map.setZoom(17);
          return;
        }

        if (autoFollow) {
          map.panTo(targetPosition);
        }

        if (changed) {
          animateMarkerTo(lat, lng, MOVE_DURATION_MS);
        } else {
          moveMarkerInstant(lat, lng);
        }
      } catch (e) {
        console.error("화면 그리기 오류:", e);
        showError("지도 화면을 갱신하는 중 오류가 발생했습니다: " + e.message);
      }
    }

    async function refreshLocation() {
      if (!BUS_NUM) {
        setLoading(false);
        showError('차량 정보가 없습니다.');
        return;
      }

      setLoading(true, '차량 위치를 불러오는 중입니다...');
      hideError();

      try {
        const url = `${GAS_API_BASE}?page=mapApi&busNum=${encodeURIComponent(BUS_NUM)}`;
        const response = await fetch(url, {
          method: 'GET',
          redirect: 'follow'
        });
        const result = await response.json();

        setLoading(false);

        if (!result || !result.success) {
          showError(result && result.message ? result.message : '현재 위치를 불러오지 못했습니다.');
          return;
        }

        renderLocation(result);
      } catch (err) {
        console.error(err);
        setLoading(false);
        showError('데이터를 가져오는 중 오류가 발생했습니다.');
      }
    }

    function toggleAutoFollow() {
      autoFollow = !autoFollow;
      document.getElementById('followStateText').textContent = autoFollow ? '자동 따라가기 켜짐' : '자동 따라가기 꺼짐';
      document.getElementById('followToggleBtn').textContent = autoFollow ? '따라가기 끄기' : '따라가기 켜기';

      if (autoFollow && currentLat != null && currentLng != null) {
        map.panTo(new naver.maps.LatLng(currentLat, currentLng));
      }
    }

    // 앱 시작 함수: 네이버 지도가 완벽히 켜진 것 확인 후 실행
    function startApp() {
      if (isAppStarted) return; // 중복 실행 방지
      
      if (!(window.naver && window.naver.maps)) {
        showError('네이버 지도 SDK가 아직 준비되지 않았습니다.');
        setLoading(false);
        return;
      }

      isAppStarted = true;
      initMap();
      refreshLocation();
      refreshTimer = setInterval(refreshLocation, REFRESH_INTERVAL_MS);
    }

    // 브라우저 렌더링이 완료되었을 때, 네이버 지도가 이미 로드되었다면 즉시 실행
    window.addEventListener('load', function() {
      if (window.__naverSdkReady) {
        startApp();
      }
    });

    window.addEventListener('beforeunload', function() {
      if (refreshTimer) clearInterval(refreshTimer);
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
    });
  </script>
</body>
</html>
